font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

background_opacity 0.85
background_blur 24

map ctrl+shift+n new_tab_with_cwd

# Cloud theme colors
background  #1a2028
foreground  #e8d0d8
cursor      #ff7eb3
cursor_text_color #1a2028
selection_background #3a2a35
selection_foreground #e8d0d8
url_color   #5cc8d4

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #ff7eb3
active_tab_foreground   #1a2028
inactive_tab_background #2a2a35
inactive_tab_foreground #8a7a80
tab_bar_background      #151a20

# Window border
active_border_color   #ff7eb3
inactive_border_color #3a3a45

# 16 ANSI colors
# Black
color0  #1a2028
color8  #3a3a45

# Red (coral/warm)
color1  #ff5f8a
color9  #ff7ea0

# Green (teal)
color2  #5cc8d4
color10 #7edce6

# Yellow (rose-gold)
color3  #e8a0b4
color11 #f0b8c8

# Blue (deep teal)
color4  #4a9caa
color12 #6bb8c8

# Magenta (pink)
color5  #ff7eb3
color13 #ff9ec8

# Cyan (bright teal)
color6  #68d8e8
color14 #8ae8f0

# White
color7  #e8d0d8
color15 #f5e8ee
