font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

background_opacity 0.85
background_blur 24
window_padding_width 10
cursor_trail 3

map ctrl+shift+n new_tab_with_cwd

# Ice HUD theme colors
background  #06101a
foreground  #bfe9f5
cursor      #2de2ff
cursor_text_color #06101a
selection_background #143047
selection_foreground #eaf7fb
url_color   #2de2ff

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #2de2ff
active_tab_foreground   #06101a
inactive_tab_background #0e2233
inactive_tab_foreground #5b7a8a
tab_bar_background      #0a1826

# Window border
active_border_color   #2de2ff
inactive_border_color #143047

# 16 ANSI colors  (cool / icy palette)
# Black
color0  #0a1826
color8  #1c4a63

# Red
color1  #ff3b5c
color9  #ff6b85

# Green (cool teal-green)
color2  #3bf0c0
color10 #74f5d6

# Yellow (icy amber accent)
color3  #ffc857
color11 #ffd980

# Blue
color4  #2d8cff
color12 #5ca8ff

# Magenta (blue-violet)
color5  #7b6bff
color13 #9d8eff

# Cyan (signature electric cyan)
color6  #2de2ff
color14 #7ff0ff

# White
color7  #bfe9f5
color15 #eaf7fb
