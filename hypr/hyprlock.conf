# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #06101a   accent #2de2ff   dim #13889c
#   text #bfe9f5  muted #5b7a8a   fail #ff3b5c   check #ffb000

general {
    hide_cursor        = true
    ignore_empty_input = true
    grace              = 0
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    = 
    path       = $HOME/.config/hypr/wallpaper.jpeg
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     = 
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(bfe9f5)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     = 
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(5b7a8a)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     = 
    text        = $USER
    color       = rgb(2de2ff)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           = 
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(2de2ffcc)
    inner_color       = rgba(06101ae6)
    font_color        = rgb(bfe9f5)
    check_color       = rgba(ffb000cc)
    fail_color        = rgba(ff3b5ccc)
    capslock_color    = rgba(13889ccc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##5b7a8a">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##ff3b5c">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
