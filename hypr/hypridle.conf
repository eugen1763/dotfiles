# Idle and sleep policy.
#
# The waybar "inhibitor" module (coffee/moon icon) takes a logind block
# inhibitor on "idle" + "handle-lid-switch". hypridle honours the idle
# inhibitor, so every listener below is disabled while the toggle is ON.
# Lid close then only locks, because logind cannot suspend either.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on

    # Respect idle inhibitors: waybar's toggle, and apps such as video players.
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false

    # Hold off the suspend until hyprlock is actually on screen.
    inhibit_sleep = 3
}

# 5 min -> lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min -> screen off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min -> suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
