# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #07191d   accent #7cddd9   dim #51a4ab
#   text #daf6f3  muted #91b9ba   fail #f58ba6   check #e6ca8b

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    =
    path       = $HOME/.config/hypr/themes/biolume-bay/wallpaper.png
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(daf6f3)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(91b9ba)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     =
    text        = $USER
    color       = rgb(7cddd9)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(7cddd9cc)
    inner_color       = rgba(07191de6)
    font_color        = rgb(daf6f3)
    check_color       = rgba(e6ca8bcc)
    fail_color        = rgba(f58ba6cc)
    capslock_color    = rgba(51a4abcc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##91b9ba">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##f58ba6">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
