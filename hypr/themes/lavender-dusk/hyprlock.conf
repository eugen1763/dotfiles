# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #171622   accent #c4aff0   dim #9380b8
#   text #ece4fa  muted #a99dba   fail #ff729b   check #f0c78a

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    =
    path       = $HOME/.config/hypr/themes/lavender-dusk/wallpaper.png
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(ece4fa)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(a99dba)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     =
    text        = $USER
    color       = rgb(c4aff0)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(c4aff0cc)
    inner_color       = rgba(171622e6)
    font_color        = rgb(ece4fa)
    check_color       = rgba(f0c78acc)
    fail_color        = rgba(ff729bcc)
    capslock_color    = rgba(9380b8cc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##a99dba">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##ff729b">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
