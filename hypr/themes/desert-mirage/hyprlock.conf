# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #211317   accent #eca28c   dim #b57569
#   text #f8e2d6  muted #c09b95   fail #ff7698   check #f3c47e

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    =
    path       = $HOME/.config/hypr/themes/desert-mirage/wallpaper.png
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(f8e2d6)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(c09b95)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     =
    text        = $USER
    color       = rgb(eca28c)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(eca28ccc)
    inner_color       = rgba(211317e6)
    font_color        = rgb(f8e2d6)
    check_color       = rgba(f3c47ecc)
    fail_color        = rgba(ff7698cc)
    capslock_color    = rgba(b57569cc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##c09b95">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##ff7698">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
