# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #0b1521   accent #8ecddd   dim #6493ad
#   text #d5e7ef  muted #91aabb   fail #ff7990   check #eac389

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    =
    path       = $HOME/.config/hypr/themes/blue-hour/wallpaper.png
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(d5e7ef)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(91aabb)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     =
    text        = $USER
    color       = rgb(8ecddd)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(8ecdddcc)
    inner_color       = rgba(0b1521e6)
    font_color        = rgb(d5e7ef)
    check_color       = rgba(eac389cc)
    fail_color        = rgba(ff7990cc)
    capslock_color    = rgba(6493adcc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##91aabb">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##ff7990">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
