# Ice HUD lock screen. Palette matches waybar/style.css and hyprland.lua.
#   bg #180f1c   accent #e6a3c0   dim #ac7695
#   text #f6e0ee  muted #b69caf   fail #fc83a7   check #edc38b

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier  = ice, 0.16, 1, 0.3, 1
    animation = fadeIn,  1, 3, ice
    animation = fadeOut, 1, 3, ice
    animation = inputFieldColors, 1, 2, ice
}

background {
    monitor    =
    path       = $HOME/.config/hypr/themes/velvet-eclipse/wallpaper.png
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.95
    brightness  = 0.32
    vibrancy    = 0.17
}

# Clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(f6e0ee)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
    shadow_passes = 0
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d.%m.%Y"
    color       = rgb(b69caf)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 0
}

# User
label {
    monitor     =
    text        = $USER
    color       = rgb(e6a3c0)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -18
    halign      = center
    valign      = center
    shadow_passes = 0
}

input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 2
    rounding          = 0
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(e6a3c0cc)
    inner_color       = rgba(180f1ce6)
    font_color        = rgb(f6e0ee)
    check_color       = rgba(edc38bcc)
    fail_color        = rgba(fc83a7cc)
    capslock_color    = rgba(ac7695cc)
    placeholder_text  = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##b69caf">enter password</span>
    fail_text         = <span font_family="JetBrainsMono Nerd Font" font_size="11pt" foreground="##fc83a7">$FAIL ($ATTEMPTS)</span>
    fade_on_empty     = false
    shadow_passes     = 0
    position          = 0, -70
    halign            = center
    valign            = center
}
